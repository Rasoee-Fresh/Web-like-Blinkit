<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rasoee Fresh | 15 Mins Delivery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #f4f6fb;
      color: #1f1f1f;
      padding-bottom: 95px;
    }

    /* Top Strip */
    .top-strip {
      background: #0c831f;
      color: #ffffff;
      padding: 7px 12px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    .top-strip a {
      color: #f7d435;
      text-decoration: none;
    }

    /* Sticky Navbar */
    .navbar {
      background: #ffffff;
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      color: #0c831f;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .brand-title span {
      color: #ea580c;
    }

    .tagline {
      font-size: 10px;
      color: #666;
      font-weight: 600;
    }

    .time-badge {
      background: #f8f9fa;
      border: 1px solid #e2e8f0;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .time-badge i {
      color: #f59e0b;
    }

    /* Search Box */
    .search-wrap {
      position: relative;
      width: 100%;
    }

    .search-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #718096;
      font-size: 14px;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: #f1f4f8;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      background: #ffffff;
      border-color: #0c831f;
    }

    /* Category Navigation */
    .category-scroll {
      display: flex;
      overflow-x: auto;
      background: #ffffff;
      padding: 10px 14px;
      gap: 8px;
      border-bottom: 1px solid #eaeaea;
      -webkit-overflow-scrolling: touch;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      white-space: nowrap;
      padding: 6px 14px;
      background: #f4f6fb;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #4b5563;
      cursor: pointer;
    }

    .cat-btn.active {
      background: #0c831f;
      color: #ffffff;
      border-color: #0c831f;
    }

    /* Store Info */
    .location-box {
      margin: 10px 14px 4px;
      padding: 8px 12px;
      background: #ffffff;
      border-radius: 8px;
      font-size: 11px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #e9ecef;
    }

    .location-box i {
      color: #0c831f;
    }

    /* Catalog Content */
    .main-content {
      padding: 6px 14px;
    }

    .heading-bar {
      font-size: 16px;
      font-weight: 800;
      margin: 12px 0;
      color: #111;
    }

    /* Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* Blinkit Item Card */
    .product-card {
      background: #ffffff;
      border: 1px solid #e6e9ee;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card-eta {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #f1f5f9;
      color: #334155;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Emoji Graphic Box */
    .card-emoji-box {
      width: 100%;
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0 6px;
      font-size: 56px;
      background: #f8fafc;
      border-radius: 10px;
      user-select: none;
    }

    .card-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 2px;
      min-height: 34px;
      color: #222;
    }

    .card-qty {
      font-size: 11px;
      color: #777;
      margin-bottom: 8px;
    }

    .card-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .price-text {
      font-size: 14px;
      font-weight: 800;
      color: #111;
    }

    .mrp-text {
      font-size: 10px;
      color: #999;
      text-decoration: line-through;
    }

    .add-btn {
      background: #ffffff;
      border: 1px solid #0c831f;
      color: #0c831f;
      font-weight: 800;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .counter-group {
      display: flex;
      align-items: center;
      background: #0c831f;
      color: #ffffff;
      border-radius: 6px;
      overflow: hidden;
    }

    .counter-group button {
      background: transparent;
      border: none;
      color: #ffffff;
      padding: 5px 8px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }

    .counter-group span {
      font-size: 12px;
      font-weight: 800;
      padding: 0 4px;
      min-width: 16px;
      text-align: center;
    }

    /* Fixed Bottom Floating Bar */
    .cart-float {
      position: fixed;
      bottom: 12px;
      left: 14px;
      right: 14px;
      background: #0c831f;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      display: none;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(12, 131, 31, 0.35);
      z-index: 1000;
      cursor: pointer;
    }

    .cart-float.show {
      display: flex;
    }

    /* Cart Modal Sheet */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1001;
      display: none;
    }

    .modal-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #ffffff;
      border-radius: 16px 16px 0 0;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s ease-out;
      z-index: 1002;
    }

    .modal-sheet.open {
      transform: translateY(0);
    }

    .modal-header {
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
    }

    .modal-list {
      padding: 16px;
      overflow-y: auto;
      max-height: 45vh;
    }

    .cart-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f6f6f6;
    }

    .modal-footer {
      padding: 16px;
      background: #fafafa;
      border-top: 1px solid #eee;
    }

    .whatsapp-btn {
      width: 100%;
      background: #0c831f;
      color: #ffffff;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Strip -->
  <div class="top-strip">
    <div>Rasooee Fresh Club | Wholesale & Retail</div>
    <div>Call: <a href="tel:9209116500">9209116500</a></div>
  </div>

  <!-- Header -->
  <header class="navbar">
    <div class="brand-row">
      <div>
        <div class="brand-title">Rasoee<span>Fresh</span></div>
        <div class="tagline">Rasoee se Dil Tak, Pure & Fresh</div>
      </div>
      <div class="time-badge">
        <i class="fa-solid fa-bolt"></i> 15 MINS
      </div>
    </div>

    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" class="search-input" placeholder='Search "Tomato", "Potato", "Milk", "Chilli"...'>
    </div>
  </header>

  <!-- Categories Scrollbar -->
  <div class="category-scroll">
    <button class="cat-btn active" data-cat="All">All Items</button>
    <button class="cat-btn" data-cat="Vegetables">Fresh Vegetables</button>
    <button class="cat-btn" data-cat="Fruits">Fresh Fruits</button>
    <button class="cat-btn" data-cat="Dairy">Dairy Products</button>
    <button class="cat-btn" data-cat="Spices">Spices & Masala</button>
  </div>

  <!-- Location Strip -->
  <div class="location-box">
    <i class="fa-solid fa-location-dot"></i>
    <span>SN 18, Sukhsagar Part-2, Near Khandoba Mandir, Kondhwa BK, Pune-46</span>
  </div>

  <!-- Product Grid Content -->
  <main class="main-content">
    <div class="heading-bar" id="categoryTitle">All Products</div>
    <div class="products-grid" id="productGrid">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <!-- Bottom Floating Cart -->
  <div class="cart-float" id="cartFloat">
    <div>
      <div style="font-size: 13px; font-weight: 800;" id="cartFloatCount">0 items</div>
      <div style="font-size: 11px; opacity: 0.9;">Delivery: FREE</div>
    </div>
    <div style="font-weight: 800; font-size: 14px;">
      View Cart <i class="fa-solid fa-arrow-right" style="margin-left: 6px;"></i>
    </div>
  </div>

  <!-- Cart Modal Sheet -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal-sheet" id="modalSheet">
    <div class="modal-header">
      <span>Order Summary</span>
      <i class="fa-solid fa-xmark" id="closeModal" style="cursor: pointer; font-size: 18px;"></i>
    </div>
    <div class="modal-list" id="cartEntries"></div>
    <div class="modal-footer">
      <div style="display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 12px; font-size: 15px;">
        <span>Grand Total</span>
        <span id="grandTotal">₹0</span>
      </div>
      <button class="whatsapp-btn" id="sendWhatsApp">
        <span><i class="fa-brands fa-whatsapp"></i> Order on WhatsApp</span>
        <span id="btnTotal">₹0</span>
      </button>
    </div>
  </div>

  <script>
    // Pure emoji items list - Fast, responsive, and 100% reliable
    const products = [
      {
        id: 1,
        name: "Fresh Hybrid Tomato",
        hindi: "Tamatar",
        unit: "1 kg",
        price: 36,
        mrp: 50,
        category: "Vegetables",
        emoji: "🍅"
      },
      {
        id: 2,
        name: "Farm Fresh Potato",
        hindi: "Aloo",
        unit: "1 kg",
        price: 32,
        mrp: 45,
        category: "Vegetables",
        emoji: "🥔"
      },
      {
        id: 3,
        name: "Nashik Red Onion",
        hindi: "Pyaaz Kanda",
        unit: "1 kg",
        price: 28,
        mrp: 40,
        category: "Vegetables",
        emoji: "🧅"
      },
      {
        id: 4,
        name: "Green Bell Capsicum",
        hindi: "Shimla Mirch",
        unit: "500 g",
        price: 45,
        mrp: 60,
        category: "Vegetables",
        emoji: "🫑"
      },
      {
        id: 5,
        name: "Spicy Green Chilli",
        hindi: "Hari Mirchi",
        unit: "200 g",
        price: 20,
        mrp: 30,
        category: "Vegetables",
        emoji: "🌶️"
      },
      {
        id: 6,
        name: "Crisp Royal Apple",
        hindi: "Seb",
        unit: "4 pcs (500g)",
        price: 110,
        mrp: 140,
        category: "Fruits",
        emoji: "🍎"
      },
      {
        id: 7,
        name: "Fresh Sweet Banana",
        hindi: "Kela",
        unit: "1 kg (5-6 pcs)",
        price: 48,
        mrp: 65,
        category: "Fruits",
        emoji: "🍌"
      },
      {
        id: 8,
        name: "Nagpur Sweet Orange",
        hindi: "Santra",
        unit: "1 kg",
        price: 79,
        mrp: 100,
        category: "Fruits",
        emoji: "🍊"
      },
      {
        id: 9,
        name: "Fresh Cow Milk Pouch",
        hindi: "Doodh",
        unit: "500 ml",
        price: 29,
        mrp: 30,
        category: "Dairy",
        emoji: "🥛"
      },
      {
        id: 10,
        name: "Fresh Malai Paneer",
        hindi: "Paneer",
        unit: "200 g",
        price: 88,
        mrp: 105,
        category: "Dairy",
        emoji: "🧀"
      },
      {
        id: 11,
        name: "Pure Desi Cow Ghee",
        hindi: "Ghee",
        unit: "500 ml",
        price: 340,
        mrp: 380,
        category: "Dairy",
        emoji: "🧈"
      },
      {
        id: 12,
        name: "Pure Haldi Powder",
        hindi: "Turmeric",
        unit: "200 g",
        price: 52,
        mrp: 65,
        category: "Spices",
        emoji: "🧂"
      },
      {
        id: 13,
        name: "Whole Cumin Seeds",
        hindi: "Jeera",
        unit: "100 g",
        price: 49,
        mrp: 65,
        category: "Spices",
        emoji: "🌿"
      },
      {
        id: 14,
        name: "Fresh Garlic Bulb",
        hindi: "Lehsun",
        unit: "250 g",
        price: 60,
        mrp: 80,
        category: "Vegetables",
        emoji: "🧄"
      }
    ];

    let cart = {};
    let selectedCat = "All";

    function render() {
      const grid = document.getElementById("productGrid");
      const searchVal = document.getElementById("searchInput").value.trim().toLowerCase();

      const filtered = products.filter(p => {
        const matchesCategory = selectedCat === "All" || p.category === selectedCat;
        const matchesSearch = !searchVal || 
          p.name.toLowerCase().includes(searchVal) || 
          p.hindi.toLowerCase().includes(searchVal) || 
          p.category.toLowerCase().includes(searchVal);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;">No items match your search.</div>';
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const qty = cart[p.id] || 0;
        return `
          <div class="product-card">
            <span class="card-eta"><i class="fa-solid fa-clock"></i> 15 MINS</span>
            <div class="card-emoji-box">${p.emoji}</div>
            <div class="card-name">${p.name}</div>
            <div class="card-qty">${p.unit}</div>
            <div class="card-action-row">
              <div>
                <div class="price-text">₹${p.price}</div>
                <div class="mrp-text">₹${p.mrp}</div>
              </div>
              <div>
                ${qty > 0 ? `
                  <div class="counter-group">
                    <button onclick="updateItem(${p.id}, -1)">-</button>
                    <span>${qty}</span>
                    <button onclick="updateItem(${p.id}, 1)">+</button>
                  </div>
                ` : `
                  <button class="add-btn" onclick="updateItem(${p.id}, 1)">ADD</button>
                `}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function updateItem(id, change) {
      const cur = cart[id] || 0;
      const next = cur + change;
      if (next <= 0) {
        delete cart[id];
      } else {
        cart[id] = next;
      }
      render();
      syncCartUI();
    }

    function syncCartUI() {
      let count = 0;
      let total = 0;

      for (let id in cart) {
        const p = products.find(i => i.id == id);
        if (p) {
          count += cart[id];
          total += (p.price * cart[id]);
        }
      }

      const bar = document.getElementById("cartFloat");
      if (count > 0) {
        bar.classList.add("show");
        document.getElementById("cartFloatCount").innerText = `${count} item${count > 1 ? 's' : ''} | ₹${total}`;
      } else {
        bar.classList.remove("show");
        closeSheet();
      }

      document.getElementById("grandTotal").innerText = `₹${total}`;
      document.getElementById("btnTotal").innerText = `₹${total}`;

      const container = document.getElementById("cartEntries");
      container.innerHTML = Object.keys(cart).map(id => {
        const p = products.find(i => i.id == id);
        const q = cart[id];
        return `
          <div class="cart-entry">
            <div>
              <div style="font-weight: 700; font-size: 13px;">${p.emoji} ${p.name}</div>
              <div style="color: #666; font-size: 11px;">₹${p.price} × ${q}</div>
            </div>
            <div style="display:flex; align-items:center; gap: 8px;">
              <div style="font-weight:800; font-size: 13px;">₹${p.price * q}</div>
              <div class="counter-group">
                <button onclick="updateItem(${p.id}, -1)">-</button>
                <span>${q}</span>
                <button onclick="updateItem(${p.id}, 1)">+</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function openSheet() {
      document.getElementById("modalOverlay").style.display = "block";
      document.getElementById("modalSheet").classList.add("open");
    }

    function closeSheet() {
      document.getElementById("modalOverlay").style.display = "none";
      document.getElementById("modalSheet").classList.remove("open");
    }

    // Category button events
    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedCat = btn.getAttribute("data-cat");
        document.getElementById("categoryTitle").innerText = selectedCat === "All" ? "All Products" : selectedCat;
        render();
      });
    });

    // Search events
    document.getElementById("searchInput").addEventListener("input", render);

    // Modal events
    document.getElementById("cartFloat").addEventListener("click", openSheet);
    document.getElementById("closeModal").addEventListener("click", closeSheet);
    document.getElementById("modalOverlay").addEventListener("click", closeSheet);

    // WhatsApp order
    document.getElementById("sendWhatsApp").addEventListener("click", () => {
      let orderMsg = "Hello *Rasoee Fresh*, I would like to place an order:%0A%0A";
      let grandTotal = 0;

      for (let id in cart) {
        const p = products.find(i => i.id == id);
        const qty = cart[id];
        const sub = p.price * qty;
        grandTotal += sub;
        orderMsg += `• ${p.emoji} ${p.name} (${p.unit}) x ${qty} = ₹${sub}%0A`;
      }

      orderMsg += `%0A*Grand Total: ₹${grandTotal}*%0A`;
      orderMsg += `Delivery Address: SN 18, Sukhsagar Part-2, Kondhwa BK, Pune-46%0A`;
      orderMsg += `Please confirm my order and share estimated arrival!`;

      window.open(`https://wa.me/919209116500?text=${orderMsg}`, "_blank");
    });

    // Auto-render on load
    render();
  </script>
</body>
  </html>
